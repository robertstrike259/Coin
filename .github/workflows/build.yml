name: build
on:
  push:
  pull_request:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            ssl: sudo apt-get update && sudo apt-get install -y libssl-dev
          - os: macos-latest
            ssl: brew install openssl@3
          - os: windows-latest
            ssl: vcpkg install openssl:x64-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: OpenSSL (native package)
        run: ${{ matrix.ssl }}
      - name: Forbid em/en dashes in project sources
        shell: bash
        run: |
          if grep -rn --include='*.cpp' --include='*.h' --include='*.md' --include='*.txt' --include='*.yml' --include='*.json' -e $'\u2013' -e $'\u2014' src apps tests .github CMakeLists.txt vcpkg.json README.md SPEC.md; then
            echo "em/en dashes are forbidden in this project"; exit 1;
          fi
      - name: Configure
        run: cmake -S . -B build -DWITH_QT=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j
      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release
